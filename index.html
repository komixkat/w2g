<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>w2g — watch together</title>
<meta name="description" content="Watch the same video file together, peer-to-peer.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050508">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050508'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='11' font-weight='bold' fill='%2300ff41' text-anchor='middle'%3Ew%3C/text%3E%3C/svg%3E">
<link rel="preload" as="font" type="font/otf" href="./fonts/Monocraft-Bold.otf" crossorigin>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="titlebar">
  <button class="logo" id="btnHome" type="button" aria-label="home">w2g</button>
  <span class="pill" id="statusPill" data-state="idle" role="status" aria-live="polite"><i class="dot"></i><span id="statusText">ready</span></span>
</header>

<main>

  <section class="view center" id="viewLanding">
    <div class="landing">
      <h1 class="display">w2g</h1>
      <p class="lede" id="lede">watch the same video file together, peer-to-peer.</p>
      <div class="field">
        <label class="lbl" for="nameInput">your name</label>
        <input type="text" id="nameInput" placeholder="name" maxlength="24" autocomplete="nickname" autocapitalize="words">
      </div>
      <div class="landing-actions">
        <button class="btn btn-green" id="btnHost">start a session</button>
        <button class="btn" id="btnJoin">join a session</button>
      </div>
    </div>
  </section>

  <section class="view hidden" id="viewRoom">
    <div class="page">

      <div class="col-left">
        <div class="panel stage-panel">
          <div class="stage">
            <video id="video" playsinline preload="metadata"></video>

            <div class="stage-empty" id="stageEmpty">
              <p class="hidden" id="stageHint"></p>
              <label class="btn btn-green" for="fileInput">choose video</label>
              <input type="file" id="fileInput" accept="video/*" hidden>
            </div>

            <div class="stage-empty hidden" id="stageRemote">
              <p id="stageRemoteText">no stream</p>
              <button class="btn btn-green hidden" id="btnWatch">watch</button>
            </div>

            <div class="stage-flag hidden" id="stagePaused">paused</div>
          </div>
          <div class="transport">
            <span class="t-file" id="fileName">&mdash;</span>
            <span class="transport-right">
              <span class="stat"><b id="statTime">00:00</b><span class="dim"> / </span><span id="statDur">00:00</span></span>
              <button type="button" class="chip" id="changeFile">change</button>
            </span>
          </div>
          <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
        </div>

        <div class="panel" id="connectPanel">
          <div class="panel-head">
            <span class="panel-title">connection</span>
          </div>
          <div class="panel-body">

            <div class="step hidden" id="stepHost">
              <div class="field">
                <label class="lbl" for="inviteOut">invite link</label>
                <div class="code-row">
                  <textarea id="inviteOut" readonly spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="choose a video first"></textarea>
                  <button type="button" class="chip hidden" id="btnShare" aria-label="share invite link">share</button>
                  <button type="button" class="chip" data-copy="inviteOut" aria-label="copy invite link">copy</button>
                </div>
              </div>
              <div class="field">
                <label class="lbl" for="replyIn">reply</label>
                <div class="code-row">
                  <textarea id="replyIn" spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="paste reply"></textarea>
                  <button type="button" class="chip" data-paste="replyIn" aria-label="paste reply">paste</button>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-green" id="btnFinish">connect</button>
                <button class="btn" id="btnResetHost">reset</button>
              </div>
            </div>

            <div class="step hidden" id="stepGuest">
              <div class="field">
                <label class="lbl" for="inviteIn">invite</label>
                <div class="code-row">
                  <textarea id="inviteIn" spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="paste link or code"></textarea>
                  <button type="button" class="chip" data-paste="inviteIn" aria-label="paste invite">paste</button>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-green" id="btnAnswer">generate reply</button>
                <button class="btn" id="btnResetGuest">reset</button>
              </div>
              <div class="field hidden" id="replyWrap">
                <label class="lbl" for="replyOut">reply</label>
                <div class="code-row">
                  <textarea id="replyOut" readonly spellcheck="false" autocapitalize="none" autocorrect="off"></textarea>
                  <button type="button" class="chip" data-copy="replyOut" aria-label="copy reply code">copy</button>
                </div>
              </div>
            </div>

            <div class="connected-note hidden" id="connectedNote">
              <span class="ok">&#9679;</span>
              <span>connected</span>
              <button class="chip" id="btnResetConnected">end</button>
            </div>

            <div class="error hidden" id="connectError" role="alert"></div>
          </div>
        </div>
      </div>

      <div class="col-right">
        <div class="panel chat-panel">
          <div class="panel-head">
            <span class="panel-title">chat<span class="caret">_</span></span>
          </div>
          <div class="chat-list" id="chatList" role="log" aria-label="chat messages"></div>
          <div class="chat-input">
            <input type="text" id="chatText" placeholder="message" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" maxlength="2000" disabled>
            <button class="btn" id="btnSend" disabled>send</button>
          </div>
        </div>
      </div>

    </div>
  </section>

</main>

<div class="toasts" id="toasts"></div>

<script type="module" src="./js/main.js"></script>
<script src="./oneko.js"></script>
</body>
</html>
